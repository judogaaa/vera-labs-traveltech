name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/search_api/requirements.txt pytest -c constraints.txt
      - run: python -c "from services.search_api.main import app; print('API import OK')"
      - run: python -m pytest -q services
        env:
          GIGACHAT_ENABLED: '0'
          TRIP_ALLOW_FIXTURES: '1'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/search_api/requirements.txt -c constraints.txt
      - run: python -m services.catalog.import_curated_hotels && python -m services.hotel_intelligence.bootstrap
      - name: Start isolated demo API
        run: |
          python -m uvicorn services.search_api.main:app --host 127.0.0.1 --port 8000 > /tmp/demo-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/api/hotel-intelligence/status && exit 0
            sleep 1
          done
          cat /tmp/demo-api.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
        env:
          CI: 'true'
          E2E_REQUIRE_API: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/e2e/screenshots
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/check_public_source.py
